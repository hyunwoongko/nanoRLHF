data:
  train_batch_size: 256
  valid_batch_size: 256
  train_micro_batch_size_per_gpu: 16
  valid_micro_batch_size_per_gpu: 16
  train_data: ./data/DeepMath-72k/preprocessed/train.nano
  valid_data: ./data/MATH-500/preprocessed/valid.nano
  num_workers: 8
  experience_staleness: 1

actor:
  model_name_or_path: "Qwen/Qwen3-1.7B"
  tokenizer_name_or_path: "Qwen/Qwen3-1.7B"
  tensor_parallel_size: 2
  pipeline_parallel_size: 2
  data_parallel_size: 1
  zero_stage: 0
  host: 127.0.0.1
  port: 23333
  backend: nccl
  seed: 42
  gradient_checkpointing_enable: true

rollout:
  model_name_or_path: "Qwen/Qwen3-1.7B"
  max_num_batched_tokens: 65536
  max_num_seqs: 1024
  max_model_len: 2048
  max_prompt_len: 512
  max_response_len: 1536
  gpu_memory_utilization: 0.9
  kvcache_block_size: 256
  tensor_parallel_size: 2
  data_parallel_size: 2
  temperature: 1.0
  top_p: 1.0
  enforce_eager: false

reward:
  name: compute_score
  path: nanorlhf.nanoverl.reward.custom_reward_fn

optim:
  lr: 5e-6
  min_lr: 0
  lr_warmup_steps_ratio: 0.1
  lr_scheduler: cosine
  beta1: 0.9
  beta2: 0.95
  clip_grad: 1.0
  weight_decay: 1e-3

algorithm:
  gamma: 1.0
  lam: 1.0
  use_kl_in_reward: false
  kl_loss_coef: 0.1
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2

training:
  default_local_dir: ./checkpoints
  project_name: math
  experiment_name: rl
  total_epochs: 1
  wandb: true
  seed: 42
  save_freq: 50
  test_freq: 50

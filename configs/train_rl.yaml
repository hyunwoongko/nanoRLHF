data:
  train_batch_size: 8
  valid_batch_size: 8
  train_micro_batch_size: 4
  valid_micro_batch_size: 4
  train_data: ./data/DeepMath-72k/preprocessed/valid.nano
  valid_data: ./data/DeepMath-72k/preprocessed/valid.nano
  num_workers: 8

actor:
  model_name_or_path: "./checkpoints/math/sft/step_2109/merged"
  tokenizer_name_or_path: "./checkpoints/math/sft/step_2109/merged"
  tensor_parallel_size: 2
  pipeline_parallel_size: 1
  data_parallel_size: 2
  zero_stage: 2
  host: 127.0.0.1
  port: 23333
  backend: nccl
  seed: 42
  gradient_checkpointing_enable: true

rollout:
  model_name_or_path: "./checkpoints/math/sft/step_2109/merged"
  max_num_batched_tokens: 65536
  max_num_seqs: 1024
  max_model_len: 2048
  n: 4
  gpu_memory_utilization: 0.9
  kvcache_block_size: 256
  tensor_parallel_size: 2
  data_parallel_size: 2

reward:
  name: compute_score
  path: nanorlhf.nanoverl.reward.custom_reward_fn

optim:
  lr: 5e-6
  min_lr: 0
  lr_warmup_steps_ratio: 0.1
  lr_scheduler: cosine
  beta1: 0.9
  beta2: 0.95
  clip_grad: 1.0
  weight_decay: 1e-3

algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: gae
  use_kl_in_reward: false
  kl_loss_coef: 0.1
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2

training:
  default_local_dir: ./checkpoints
  project_name: math
  experiment_name: rl
  total_epochs: 1
  wandb: true
  seed: 42
  save_freq: 50
  test_freq: 50
